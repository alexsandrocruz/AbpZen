<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">
          {{ '::Menu:Cases' | abpLocalization }}
        </h5>
      </div>
      <div class="text-end col col-md-6">
        <div class="text-lg-end pt-2">
          <button *abpPermission="'Lexus.Case.Create'" id="create" class="btn btn-primary" type="button"
            (click)="createCase()">
            <i class="fa fa-plus me-1"></i>
            <span>{{ '::NewCase' | abpLocalization }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
    <div class="card-body">
      <ngx-datatable [rows]="case.items" [count]="case.totalCount" [list]="list" default>
        <ngx-datatable-column
          [name]="'::Actions' | abpLocalization"
          [maxWidth]="150"
          [sortable]="false"
        >
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div ngbDropdown container="body" class="d-inline-block">
              <button
                class="btn btn-primary btn-sm dropdown-toggle"
                data-toggle="dropdown"
                aria-haspopup="true"
                ngbDropdownToggle
              >
                <i class="fa fa-cog me-1"></i>::Actions
              </button>
              <div ngbDropdownMenu>
                <button
                  *abpPermission="'Lexus.Case.Edit'"
                  ngbDropdownItem
                  (click)="editCase(row.id)"
                >
                  ::Edit
                </button>
                <button
                  *abpPermission="'Lexus.Case.Delete'"
                  ngbDropdownItem
                  (click)="deleteCase(row.id)"
                >
                  ::Delete
                </button>
              </div>
            </div>
          </ng-template>
        </ngx-datatable-column>

        
        <ngx-datatable-column [name]="'::CaseNumber' | abpLocalization" prop="caseNumber">
          
          
        </ngx-datatable-column>
        
        <ngx-datatable-column [name]="'::Title' | abpLocalization" prop="title">
          
          
        </ngx-datatable-column>
        
      </ngx-datatable>
    </div>
  </div>
</div>

<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <h3>{{ (selectedCase.id ? '::Edit' : '::NewCase') | abpLocalization }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" (ngSubmit)="save()">
      
      <div class="form-group">
        <label for="case-number">{{ '::CaseNumber' | abpLocalization }}</label><span></span>
        
        <input type="text" id="case-number" class="form-control" formControlName="caseNumber" autofocus />
        
      </div>
      
      <div class="form-group">
        <label for="title">{{ '::Title' | abpLocalization }}</label><span></span>
        
        <input type="text" id="title" class="form-control" formControlName="title" autofocus />
        
      </div>
      
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" abpClose>
      {{ '::Close' | abpLocalization }}
    </button>
    <button class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
      <i class="fa fa-check mr-1"></i>
      {{ '::Save' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
