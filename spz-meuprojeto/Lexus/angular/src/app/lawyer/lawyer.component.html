<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">
          {{ '::Menu:Lawyers' | abpLocalization }}
        </h5>
      </div>
      <div class="text-end col col-md-6">
        <div class="text-lg-end pt-2">
          <button *abpPermission="'Lexus.Lawyer.Create'" id="create" class="btn btn-primary" type="button"
            (click)="createLawyer()">
            <i class="fa fa-plus me-1"></i>
            <span>{{ '::NewLawyer' | abpLocalization }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
    <div class="card-body">
      <ngx-datatable [rows]="lawyer.items" [count]="lawyer.totalCount" [list]="list" default>
        <ngx-datatable-column
          [name]="'::Actions' | abpLocalization"
          [maxWidth]="150"
          [sortable]="false"
        >
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div ngbDropdown container="body" class="d-inline-block">
              <button
                class="btn btn-primary btn-sm dropdown-toggle"
                data-toggle="dropdown"
                aria-haspopup="true"
                ngbDropdownToggle
              >
                <i class="fa fa-cog me-1"></i>::Actions
              </button>
              <div ngbDropdownMenu>
                <button
                  *abpPermission="'Lexus.Lawyer.Edit'"
                  ngbDropdownItem
                  (click)="editLawyer(row.id)"
                >
                  ::Edit
                </button>
                <button
                  *abpPermission="'Lexus.Lawyer.Delete'"
                  ngbDropdownItem
                  (click)="deleteLawyer(row.id)"
                >
                  ::Delete
                </button>
              </div>
            </div>
          </ng-template>
        </ngx-datatable-column>

        
        <ngx-datatable-column [name]="'::FullName' | abpLocalization" prop="fullName">
          
          
        </ngx-datatable-column>
        
        <ngx-datatable-column [name]="'::PreferredName' | abpLocalization" prop="preferredName">
          
          
        </ngx-datatable-column>
        
      </ngx-datatable>
    </div>
  </div>
</div>

<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <h3>{{ (selectedLawyer.id ? '::Edit' : '::NewLawyer') | abpLocalization }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" (ngSubmit)="save()">
      
      <div class="form-group">
        <label for="full-name">{{ '::FullName' | abpLocalization }}</label><span></span>
        
        <input type="text" id="full-name" class="form-control" formControlName="fullName" autofocus />
        
      </div>
      
      <div class="form-group">
        <label for="preferred-name">{{ '::PreferredName' | abpLocalization }}</label><span></span>
        
        <input type="text" id="preferred-name" class="form-control" formControlName="preferredName" autofocus />
        
      </div>
      
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" abpClose>
      {{ '::Close' | abpLocalization }}
    </button>
    <button class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
      <i class="fa fa-check mr-1"></i>
      {{ '::Save' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
