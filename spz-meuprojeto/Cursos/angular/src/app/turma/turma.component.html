<abp-page [title]="'::Turmas' | abpLocalization">
  <abp-page-toolbar>
    <button
      *abpPermission="'Sapienza.Cursos.Turma.Create'"
      class="btn btn-primary"
      type="button"
      (click)="createTurma()"
    >
      <i class="fa fa-plus me-1"></i>
      <span>{{ '::NewTurma' | abpLocalization }}</span>
    </button>
  </abp-page-toolbar>

  <div class="card">
    <div class="card-body">
      <ngx-datatable [rows]="turma.items" [count]="turma.totalCount" [list]="list" default>
        <ngx-datatable-column
          [name]="'::Actions' | abpLocalization"
          [maxWidth]="150"
          [sortable]="false"
        >
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div ngbDropdown container="body" class="d-inline-block">
              <button
                class="btn btn-primary btn-sm dropdown-toggle"
                data-toggle="dropdown"
                aria-haspopup="true"
                ngbDropdownToggle
              >
                <i class="fa fa-cog me-1"></i>::Actions
              </button>
              <div ngbDropdownMenu>
                <button
                  *abpPermission="'Sapienza.Cursos.Turma.Edit'"
                  ngbDropdownItem
                  (click)="editTurma(row.id)"
                >
                  ::Edit
                </button>
                <button
                  *abpPermission="'Sapienza.Cursos.Turma.Delete'"
                  ngbDropdownItem
                  (click)="deleteTurma(row.id)"
                >
                  ::Delete
                </button>
              </div>
            </div>
          </ng-template>
        </ngx-datatable-column>

        
        <ngx-datatable-column [name]="'::Nome' | abpLocalization" prop="nome">
          
          
        </ngx-datatable-column>
        
      </ngx-datatable>
    </div>
  </div>
</abp-page>

<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <h3>{{ (selectedTurma.id ? '::Edit' : '::NewTurma') | abpLocalization }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" (ngSubmit)="save()">
      
      <div class="form-group">
        <label for="nome">{{ '::Nome' | abpLocalization }}</label><span></span>
        
        <input type="text" id="nome" class="form-control" formControlName="nome" autofocus />
        
      </div>
      
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" abpClose>
      ::Cancel
    </button>
    <button class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
      <i class="fa fa-check mr-1"></i>
      ::Save
    </button>
  </ng-template>
</abp-modal>
