name: Deploy ZenCode Generator

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'zencode-generator/**'
      - '.github/workflows/deploy-caprover.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Lowercase Repository Name
      id: repo_name
      run: |
        echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./zencode-generator/Dockerfile
        push: true
        tags: ghcr.io/${{ env.REPO_LOWER }}/zencode-generator:latest

    - name: Deploy to CapRover
      run: |
        npm install -g caprover
        caprover deploy \
          --host '${{ secrets.CAPROVER_SERVER }}' \
          --appToken '${{ secrets.APP_TOKEN }}' \
          --appName '${{ secrets.APP_NAME }}' \
          --imageName 'ghcr.io/${{ env.REPO_LOWER }}/zencode-generator:latest'
